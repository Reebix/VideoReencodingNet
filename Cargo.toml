[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["json", "multipart", "tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
clap = { version = "4.5.38", features = ["derive"] }
tokio = { version = "1.34.0", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
sqlx = { version = "0.9.0", features = ["sqlite-bundled", "runtime-tokio"] }
tracing = "0.1.44"
async-trait = "0.1.92"
tower-http = { version = "0.7.1", features = ["cors"] }
dotenvy = "0.15.7"
rayon = "1.12.0"

logging = { path = "crates/logging" }
db = { path = "crates/db" }
api = { path = "crates/api" }
config = { path = "crates/config" }
media = { path = "crates/media" }